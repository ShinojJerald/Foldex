name: Bug report
description: Something in Foldex doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a PDF in the PDF editor
        2. ...
  - type: input
    id: version
    attributes:
      label: Foldex version
      description: Shown at the bottom of the sidebar.
      placeholder: "1.0.0"
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or files
      description: Please don't attach private documents. A small sample file that shows the problem helps most.
